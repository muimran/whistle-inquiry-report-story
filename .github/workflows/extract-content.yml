# Re-extracts editor/content.json from source files whenever they change.
# This keeps the editor page in sync with your code edits.
name: Sync editor content

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/interactives/*/content.js'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node editor/extract.js

      - name: Commit updated content.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add editor/content.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: sync editor/content.json from source"
          git push
